name: Build Windows application

on:
  push:
    branches:
      - dev
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ui/pytool-ui/yarn.lock

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          python -c "import webview, openpyxl, python_calamine, PyInstaller; print('runtime ok')"

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: ui/pytool-ui
        run: yarn.cmd install --frozen-lockfile

      - name: Build application
        shell: pwsh
        run: python scripts/build_package.py

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/pytool/pytool.exe")) {
            throw "Packaged executable was not created."
          }
          if (-not (Test-Path "dist/pytool/_internal/ui/dist/client/index.html")) {
            throw "Packaged frontend entry was not created."
          }

      # Upload the folder itself (not a zip-of-a-zip). Downloading the
      # artifact unpacks once to: <artifact-name>/pytool.exe + _internal/
      - name: Upload Windows package
        uses: actions/upload-artifact@v5
        with:
          name: pytool-windows-x64-${{ github.ref_name }}
          path: dist/pytool
          if-no-files-found: error

      # Release attachment: one zip whose top level is a single "pytool" folder.
      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/pytool -DestinationPath "dist/pytool-windows-x64-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pytool-windows-x64-${{ github.ref_name }}.zip
          generate_release_notes: true