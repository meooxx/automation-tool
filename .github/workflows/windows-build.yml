name: Build Windows application

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: ui/pytool-ui/yarn.lock

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: ui/pytool-ui
        run: yarn.cmd install --frozen-lockfile

      - name: Build application
        shell: pwsh
        run: python scripts/build_package.py

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/pytool/pytool.exe")) {
            throw "Packaged executable was not created."
          }
          if (-not (Test-Path "dist/pytool/_internal/ui/dist/client/index.html")) {
            throw "Packaged frontend entry was not created."
          }

      - name: Create distributable archive
        shell: pwsh
        run: Compress-Archive -Path dist/pytool -DestinationPath dist/pytool-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pytool-windows-x64
          path: dist/pytool-windows-x64.zip
          if-no-files-found: error
