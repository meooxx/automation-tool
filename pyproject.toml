[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pytool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pywebview>=5.0",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "python-calamine>=0.8",
    "python-dateutil>=2.9",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
nuitka = ["nuitka>=2.5", "ordered-set>=4.1", "zstandard>=0.22"]

[project.scripts]
pytool = "pytool.app:run"

[tool.setuptools.packages.find]
where = ["src"]
